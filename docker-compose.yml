# Runs the whole stack locally: API + MySQL + Redis + RabbitMQ
#   cp .env.example .env
#   docker compose up -d --build
# API:      http://localhost:8080
# Swagger:  http://localhost:8080/swagger-ui.html
# RabbitMQ: http://localhost:15673 (guest / guest)
# MySQL:    localhost:3307 (root / DB_PASSWORD)

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: BloodBankDB
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-bloodbank}
      TZ: Asia/Ho_Chi_Minh
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-bloodbank}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: jdbc:mysql://mysql:3306/BloodBankDB?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-bloodbank}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  mysql-data:
