spring.application.name=blood
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Every secret comes from environment variables (see .env.example).
# The defaults below are for local development only.
# ---------------------------------------------------------------------------

# Database (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/BloodBankDB?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true
spring.servlet.encoding.enabled=true
logging.charset.console=UTF-8
logging.charset.file=UTF-8

# JWT (HS256 needs a secret of at least 32 characters)
jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Mail (Gmail SMTP with an App Password)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
inventory.alert.threshold=${INVENTORY_ALERT_THRESHOLD:1000}
admin.contact.email=${ADMIN_CONTACT_EMAIL:admin@bloodbank.local}

# Root admin created on first start when no admin exists
app.seed.admin-email=${ADMIN_EMAIL:admin@bloodbank.local}
app.seed.admin-password=${ADMIN_PASSWORD:Admin@123}

# SQL logging (turn on locally with SHOW_SQL=true)
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# RabbitMQ (RABBITMQ_URL, e.g. a CloudAMQP amqps:// URL, overrides host/port/user/password)
spring.rabbitmq.addresses=${RABBITMQ_URL:}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=3000ms
spring.rabbitmq.listener.simple.retry.max-attempts=3

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=method

# Health check for Docker / hosting platforms
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
# Mail is optional, so an unconfigured SMTP server must not mark the app as DOWN
management.health.mail.enabled=false
